#include <iostream>
using namespace std;

int main() {
    cout << "Hello, World!" << endl;
   int x = 10;
   int y = x++;
   int z = ++x;
    cout << "x: " << x <<endl;
    cout<<"y: " << y << endl;
    cout<<"z: " << z << endl;
// This program prints a greeting message to the console.

    return 0;
}
